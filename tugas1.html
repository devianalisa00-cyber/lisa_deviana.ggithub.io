<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 1 - Website Pengisian Google Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .card-header h2 {
      font-size: 1.25rem;
      color: #1f2937;
    }

    .btn-form {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-form:hover {
      background-color: #1e40af;
    }

    .form-wrapper {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background-color: #fafafa;
    }

    .form-wrapper iframe {
      width: 100%;
      height: 850px;
      border: none;
      display: block;
    }

    .note {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #6b7280;
      text-align: center;
    }

    .note a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .note a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.85rem;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.5rem;
      }

      .form-wrapper iframe {
        height: 750px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tugas 1</h1>
    <p>Silakan isi formulir di bawah ini untuk melengkapi pengumpulan data.</p>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <h2>Formulir Pengisian Data</h2>
        <a 
          href="https://docs.google.com/forms/d/e/1FAIpQLSfBhvZP2rqo_rvaTp0P5T5xRE3wVMMTjW4yIrU_Q7Sip-vCBg/viewform?usp=header" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn-form">
          Buka Google Form di Tab Baru
        </a>
      </div>

      <div class="form-wrapper">
        <iframe 
          src="https://docs.google.com/forms/d/e/1FAIpQLSfBhvZP2rqo_rvaTp0P5T5xRE3wVMMTjW4yIrU_Q7Sip-vCBg/viewform?embedded=true"
          title="Google Form Tugas 1"
          loading="lazy">
          Memuat formulir…
        </iframe>
      </div>

      <p class="note">
        Jika formulir tidak tampil di atas, silakan klik
        <a 
          href="https://docs.google.com/forms/d/e/1FAIpQLSfBhvZP2rqo_rvaTp0P5T5xRE3wVMMTjW4yIrU_Q7Sip-vCBg/viewform?usp=header" 
          target="_blank" 
          rel="noopener noreferrer">
          tautan Google Form ini
        </a>.
      </p>
    </section>
  </main>

  <footer>
    &copy; 2026 Tugas 1 Website. Dibuat untuk GitHub Pages.
  </footer>

</body>
</html>
