*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,"Times New Roman",serif;background:var(--paper);color:var(--ink);line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}

.dropdown:hover .dropdown-menu,
.dropdown:focus-within .dropdown-menu{display:block}
.dropdown-menu a{padding:.45rem .8rem;font-size:.9rem}
main{max-width:1000px;width:100%;margin:0 auto;padding:0 1.2rem;flex:1}
.halaman{padding:3rem 0 4rem}
h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;color:var(--navy)}
.pengantar{font-size:1.1rem;margin:1rem 0 1.5rem}
.form-wrap{background:#fff;border:2px solid var(--navy);border-radius:10px;overflow:hidden}
.form-wrap iframe{display:block;width:100%;height:1400px;border:0}
.judul-data{font-size:1.6rem;color:var(--navy);margin:2.5rem 0 1rem}
.alt{font-family:Arial,sans-serif;font-size:.9rem;margin-top:1rem}
.alt a{color:var(--navy);font-weight:bold}
footer{background:var(--navy);color:#c5cee0;text-align:center;padding:1.5rem;font-family:Arial,sans-serif;font-size:.9rem}
@media(max-width:640px){nav{justify-content:center}.form-wrap iframe{height:1600px}}
